name: Unify V9 CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: unify_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ppassword"
          --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, mysql, zip, gd, intl
          coverage: none
      - name: Install Dependencies
        run: |
          cd unify-backend
          composer install --no-interaction --prefer-dist --no-progress
      - name: Configure Test Env (MySQL)
        run: |
          cd unify-backend
          cp .env.example .env
          php artisan key:generate
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=unify_test/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=password/' .env
      - name: Run Migrations
        run: |
          cd unify-backend
          php artisan migrate --force
      - name: Run Backend Tests
        run: |
          cd unify-backend
          php artisan test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Typecheck
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npx tsc --noEmit
      - name: Run Frontend Tests
        run: |
          cd frontend
          npx jest --ci
      - name: Build
        run: |
          cd frontend
          npm run build
      - name: Build Storybook
        run: |
          cd frontend
          npx storybook build

  deploy:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Frontend
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run build
      - name: Deploy Frontend via FTP (cPanel)
        uses: sebastianpopp/ftp-action@releases/v4
        with:
          host: ${{ secrets.FTP_HOST }}
          user: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          localDir: "frontend/dist"
          remoteDir: "public_html"
          options: "--delete --exclude .htaccess"
      - name: Post-Deployment Health Check
        run: |
          sleep 10
          curl -sf --max-time 10 https://api.unify-cs.ac.ir/api/health || echo "health-check-warning: backend health endpoint not reachable (check cron/backend deploy)"
