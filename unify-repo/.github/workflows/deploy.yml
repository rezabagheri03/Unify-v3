name: Production Deployment - Hardened v3

# SINGLE production pipeline (SEC-07/TODO-003 consolidation):
#  - Key-authenticated SSH only (no plaintext FTP, no sshpass passwords,
#    no StrictHostKeyChecking=no).
#  - Host key is verified against SSH_HOST_KEY_FINGERPRINT.
#  - Build once -> stage -> atomic swap -> migrate -> cache -> health check.
#  - Rollback restores the previous release on failure.
#
# Required repo secrets:
#   SSH_HOST                 e.g. unify-cs.ac.ir
#   SSH_USER                 cPanel user with SSH access
#   SSH_PRIVATE_KEY          ed25519/rsa private key for that user (deploy-only key)
#   SSH_HOST_KEY_FINGERPRINT SHA256 fingerprint of the host key (from cPanel/SSH)
# Legacy secrets FTP_PASSWORD / reusing the same password for FTP+SSH are RETIRED.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  DEPLOY_PATH: /home/${{ secrets.SSH_USER }}/unify-backend
  FRONTEND_PATH: /home/${{ secrets.SSH_USER }}/public_html
  STAGING_PATH: /home/${{ secrets.SSH_USER }}/staging
  RELEASES_PATH: /home/${{ secrets.SSH_USER }}/releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, mysql, zip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies (optimized, no-dev)
        run: |
          cd unify-backend
          composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      - name: Build Frontend
        env:
          # Belt-and-braces with frontend/.env.production: without this the
          # bundle falls back to same-origin /api/v1, which resolves to the
          # SPA shell (index.html) on the production domain — every API call
          # would return HTML. Deployment blocker unless set.
          VITE_API_URL: https://api.unify-cs.ac.ir/api/v1
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run build

      - name: Package Release Tarball
        run: |
          tar -czf release.tar.gz unify-backend frontend/dist

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: release.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download Release Tarball
        uses: actions/download-artifact@v4
        with:
          name: release-tarball

      - name: Upload Release to Staging (SSH key auth)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_KEY_FINGERPRINT }}
          source: "release.tar.gz"
          target: ${{ env.STAGING_PATH }}/
          strip_components: 0

      - name: Backup, Stage, Atomic Swap, Migrate, Cache (SSH key auth)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_KEY_FINGERPRINT }}
          script: |
            set -e
            RELEASE=$(date +%Y%m%d_%H%M%S)
            mkdir -p ${{ env.RELEASES_PATH }}/$RELEASE

            # Snapshot current live tree as the instant-rollback release
            if [ -d ${{ env.DEPLOY_PATH }} ]; then
              cp -r ${{ env.DEPLOY_PATH }} ${{ env.RELEASES_PATH }}/$RELEASE/backend.old || true
            fi
            if [ -d ${{ env.FRONTEND_PATH }} ]; then
              cp -r ${{ env.FRONTEND_PATH }} ${{ env.RELEASES_PATH }}/$RELEASE/frontend.old || true
            fi

            # Unpack staged payload
            rm -rf ${{ env.STAGING_PATH }}/payload
            mkdir -p ${{ env.STAGING_PATH }}/payload
            tar -xzf ${{ env.STAGING_PATH }}/release.tar.gz -C ${{ env.STAGING_PATH }}/payload

            # Preserve live-only state across releases
            if [ -f ${{ env.DEPLOY_PATH }}/.env ]; then
              cp ${{ env.DEPLOY_PATH }}/.env ${{ env.STAGING_PATH }}/payload/unify-backend/.env
            fi
            if [ -d ${{ env.DEPLOY_PATH }}/storage ]; then
              rm -rf ${{ env.STAGING_PATH }}/payload/unify-backend/storage
              cp -r ${{ env.DEPLOY_PATH }}/storage ${{ env.STAGING_PATH }}/payload/unify-backend/storage
            fi

            # Atomic swap (backend), then frontend swap
            rm -rf ${{ env.DEPLOY_PATH }}.old || true
            if [ -d ${{ env.DEPLOY_PATH }} ]; then mv ${{ env.DEPLOY_PATH }} ${{ env.DEPLOY_PATH }}.old; fi
            mv ${{ env.STAGING_PATH }}/payload/unify-backend ${{ env.DEPLOY_PATH }}

            rm -rf ${{ env.FRONTEND_PATH }}.old || true
            if [ -d ${{ env.FRONTEND_PATH }} ]; then mv ${{ env.FRONTEND_PATH }} ${{ env.FRONTEND_PATH }}.old; fi
            mkdir -p ${{ env.FRONTEND_PATH }}
            cp -r ${{ env.STAGING_PATH }}/payload/frontend/dist/. ${{ env.FRONTEND_PATH }}/
            # The server's own .htaccess lives one level up / is preserved via .old
            if [ -f ${{ env.FRONTEND_PATH }}.old/.htaccess ]; then cp ${{ env.FRONTEND_PATH }}.old/.htaccess ${{ env.FRONTEND_PATH }}/.htaccess; fi

            # Migrate AFTER the swap (code and schema can never diverge on the
            # live path; migrations must stay backward-compatible by policy)
            cd ${{ env.DEPLOY_PATH }}
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

      - name: Post-Deployment Health Check
        run: |
          sleep 10
          curl -f --max-time 10 https://api.unify-cs.ac.ir/api/health

      - name: Rollback on Failure (restore previous release)
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_KEY_FINGERPRINT }}
          script: |
            set -e
            if [ -d ${{ env.DEPLOY_PATH }}.old ]; then
              rm -rf ${{ env.DEPLOY_PATH }}
              mv ${{ env.DEPLOY_PATH }}.old ${{ env.DEPLOY_PATH }}
            fi
            if [ -d ${{ env.FRONTEND_PATH }}.old ]; then
              rm -rf ${{ env.FRONTEND_PATH }}
              mv ${{ env.FRONTEND_PATH }}.old ${{ env.FRONTEND_PATH }}
            fi

  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Prune Old Releases (keep last 5)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_KEY_FINGERPRINT }}
          script: |
            if [ -d ${{ env.RELEASES_PATH }} ]; then
              cd ${{ env.RELEASES_PATH }} && ls -t | tail -n +6 | xargs -r rm -rf
            fi
