name: Unify V9 CI/CD

on:
  push:
    branches: [ main, develop, U2 ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: unify_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ppassword"
          --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, mysql, zip, gd, intl
          coverage: none
      - name: Install Dependencies
        run: |
          cd unify-backend
          composer install --no-interaction --prefer-dist --no-progress
      # TODO-035 supply-chain gate (blocking): production deps must be clean.
      # Filtered: the three laravel/framework advisories below have NO upstream
      # patch on the 11.x line and are NOT EXPLOITABLE in this codebase
      # (no 'email' validation rule, zero signed routes — grep-verified).
      # Everything else fails the build. See docs/DECISIONS.md D-014 (Laravel 12
      # upgrade is scheduled to retire this exception list).
      - name: Composer audit (production, blocking)
        run: |
          cd unify-backend
          composer audit --no-dev --no-interaction --format=json > audit.json || true
          python3 - << 'EOF'
          import json, sys
          IGNORED = {
              'PKSA-3r5d-mb8f-1qw9': 'Laravel CRLF email-rule: no 11.x patch; rule unused in app (D-014)',
              'PKSA-mdq4-51ck-6kdq': 'same advisory, CVE record (D-014)',
              'PKSA-m5cs-t1y6-qpcs': 'Laravel signed-URL confusion: no 11.x patch; signed routes unused (D-014)',
          }
          try:
              data = json.load(open('audit.json'))
          except Exception as e:
              print('audit.json unreadable:', e); sys.exit(1)
          remaining = []
          for pkg, items in (data.get('advisories') or {}).items():
              for a in items:
                  aid = a.get('advisoryId')
                  if aid in IGNORED:
                      print(f'IGNORED {aid} ({pkg}): {IGNORED[aid]}')
                  else:
                      remaining.append(f"{aid} {pkg} {a.get('title','')}")
          if remaining:
              print('BLOCKING advisories:'); [print(' ', r) for r in remaining]; sys.exit(1)
          print('composer audit: clean after documented exceptions')
          EOF
      # Full audit incl. dev tooling: reported but not blocking.
      - name: Composer audit (full, informational)
        run: |
          cd unify-backend
          composer audit --no-interaction || true
      # .env.example ships sqlite defaults with the MySQL DB_* block COMMENTED
      # OUT, so in-place sed substitutions for DB_HOST/USERNAME/PASSWORD silently
      # no-op'ed and Laravel fell back to config defaults (user 'root', empty
      # password) — CI failure: SQLSTATE 1045 access denied (using password: NO).
      # Fix: delete every DB_* line, then append the full MySQL block.
      - name: Configure Test Env (MySQL)
        run: |
          cd unify-backend
          cp .env.example .env
          php artisan key:generate
          sed -i '/^DB_/d' .env
          cat >> .env <<'ENV'
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=unify_test
          DB_USERNAME=root
          DB_PASSWORD=password
          ENV
      - name: Run Migrations
        # Step-level env is belt-and-braces: real process env always beats .env
        # (phpdotenv is immutable), so migrate can never silently fall back to
        # config/database.php defaults even if the .env block above regresses.
        # NOTE: PHPUnit's <env> entries do not override real env — which the
        # sqlite test leg relies on, and the MySQL parity leg (below) exploits.
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: unify_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: |
          cd unify-backend
          php artisan migrate --force
      - name: Run Backend Tests
        run: |
          cd unify-backend
          php artisan test
      # Post-audit F-05: the phpunit.xml <env> pins have no `force`, so REAL
      # env wins — this leg re-runs the same suite against the MySQL 8 service,
      # catching dialect-only breakage (the MariaDB functional-index incident
      # class) that sqlite can never see. The sqlite leg above stays the fast
      # default for dev.
      - name: Run Backend Tests (MySQL dialect parity)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: unify_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: |
          cd unify-backend
          php artisan test
      # Failure observability: which commit + what did the app actually log.
      # Import/DDL catch-blocks return deliberately generic 500s (F-11) and
      # put the real exception in laravel.log — without this step a backend
      # leg failure is undebuggable from Actions output alone. Runs whichever
      # leg (sqlite or MySQL parity) trips first, and the printed SHA settles
      # any "did this run the stale commit?" question.
      - name: Dump backend logs on failure
        if: failure()
        run: |
          echo "BACKEND LEG COMMIT: $(git rev-parse --short HEAD)"
          cd unify-backend
          for f in storage/logs/*.log; do
            [ -f "$f" ] || continue
            echo "=== $f (last 120 lines) ==="
            tail -n 120 "$f"
          done

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Typecheck
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npx tsc --noEmit
      # TODO-035 supply-chain gate (blocking): shipped deps must be >= moderate-clean.
      # Known dev-only advisories (vite/esbuild dev server, storybook's uuid) are
      # excluded via --omit=dev — they never reach the production bundle.
      - name: npm audit (production, blocking)
        run: |
          cd frontend
          npm audit --omit=dev --audit-level=moderate
      - name: npm audit (full, informational)
        run: |
          cd frontend
          npm audit || true
      - name: Run Frontend Tests
        run: |
          cd frontend
          npx jest --ci
      - name: Build
        run: |
          cd frontend
          npm run build
      - name: Build Storybook
        run: |
          cd frontend
          npx storybook build

  # NOTE (SEC-07/TODO-003): the FTP deploy job that used to live here was
  # removed. deploy.yml is now the SINGLE production pipeline — no second
  # workflow may deploy on push to main. This file is CI (verify) only.
